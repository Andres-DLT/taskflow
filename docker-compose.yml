# Stack local "prod-like": mismas imágenes y topología que producción, sin TLS.
#   docker compose up -d --build   →  http://localhost:8080
# Para desarrollo con hot-reload: `docker compose up -d db` + `npm run dev` en backend/ y frontend/.
name: taskflow

x-backend-build: &backend-build
  context: ./backend
  target: runtime
  args:
    APP_VERSION: local
    GIT_SHA: local

x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: debug
  DB_HOST: db
  DB_NAME: taskflow
  DB_USER: taskflow
  DB_PASSWORD: taskflow  # Solo para local. En producción se usa un Docker secret.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: *backend-build
    image: taskflow-backend:local
    command: ["node", "src/migrate.js"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: taskflow-backend:local
    environment: *backend-env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local
        GIT_SHA: local
    image: taskflow-frontend:local

  proxy:
    image: caddy:2.11-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
