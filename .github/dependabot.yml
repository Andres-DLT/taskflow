# Actualizaciones automáticas de dependencias, imágenes base, actions y providers.
# Agrupadas por ecosistema para no inundar de PRs; cada PR pasa por el CI completo.
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly, day: monday }
