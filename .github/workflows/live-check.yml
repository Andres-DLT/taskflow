# Prueba en vivo bajo demanda: GitHub entra en la app desplegada desde fuera,
# crea una tarea, comprueba que llega a la base de datos y la borra.
# Se lanza a mano desde Actions → "Prueba en vivo" → Run workflow.
name: Prueba en vivo

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL pública de la app (p. ej. https://xxxx.lhr.life)
        required: true
        type: string
      visible:
        description: Segundos que la tarea de prueba queda visible en la app
        required: false
        default: "15"
        type: string

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    name: Navegador → Caddy → API → PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar parámetros
        env:
          APP_URL: ${{ inputs.url }}
          VISIBLE: ${{ inputs.visible }}
        run: |
          [[ "$APP_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] || { echo "::error::URL no válida: $APP_URL"; exit 1; }
          [[ "$VISIBLE" =~ ^[0-9]+$ && "$VISIBLE" -le 120 ]] || { echo "::error::'visible' debe ser un número entre 0 y 120"; exit 1; }

      - name: Crear, leer y borrar una tarea en la app en vivo
        env:
          APP_URL: ${{ inputs.url }}
          VISIBLE: ${{ inputs.visible }}
        run: bash deploy/scripts/live-check.sh "$APP_URL" "$VISIBLE"
