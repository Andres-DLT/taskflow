# Integración continua: se ejecuta en cada PR y, como workflow reutilizable, antes de cada CD.
# Todas las actions están fijadas por SHA (inmutables); Dependabot las mantiene al día.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · lint, tests e integración
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Tests (unitarios + integración con PostgreSQL real) con cobertura
        run: npm run test:coverage
        env:
          DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow_test
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend · lint, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  static-analysis:
    name: Dockerfiles, shell y compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint backend
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: Hadolint frontend
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - name: ShellCheck
        run: shellcheck --severity=warning deploy/scripts/*.sh
      - name: Validar ficheros compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          mkdir -p deploy/secrets
          for s in db_password grafana_admin_password alert_webhook_url; do echo dummy > "deploy/secrets/$s"; done
          IMAGE_TAG=ci DOMAIN=ci.example.com ACME_EMAIL=ci@example.com IMAGE_NAMESPACE=ci \
            docker compose -f deploy/docker-compose.prod.yml --profile monitoring config --quiet
      - name: Validar configuración de Prometheus y alertas
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
      - name: Validar configuración de Alertmanager
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/deploy/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validar Caddyfile
        run: |
          docker run --rm -e DOMAIN=ci.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets-scan:
    name: Detección de secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLI oficial sobre todo el historial: funciona también en el primer push y no requiere licencia.
      - name: gitleaks (historial completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner

  e2e:
    name: E2E · stack completo con Docker Compose + Trivy
    needs: [backend, frontend, static-analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir imágenes
        run: docker compose build
      - name: Levantar el stack
        run: docker compose up -d proxy
      - name: Smoke tests
        run: SMOKE_ATTEMPTS=24 bash deploy/scripts/smoke-test.sh http://localhost:8080
      - name: Flujo de escritura a través del proxy
        run: |
          id=$(curl -fsS -X POST http://localhost:8080/api/tasks -H 'Content-Type: application/json' \
                 -d '{"title":"e2e"}' | jq -r .id)
          curl -fsS http://localhost:8080/api/tasks | jq -e --argjson id "$id" 'any(.[]; .id == $id)'
          curl -fsS -X PATCH "http://localhost:8080/api/tasks/$id" -H 'Content-Type: application/json' \
                 -d '{"done":true}' | jq -e '.done == true'
          curl -fsS -o /dev/null -w '%{http_code}\n' -X DELETE "http://localhost:8080/api/tasks/$id" | grep -q 204
      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color
      - name: Trivy · imagen backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-backend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy · imagen frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-frontend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Apagar
        if: always()
        run: docker compose down -v
