# Entrega continua: main → CI → build/scan/firma → staging (auto) → production (aprobación manual).
# Los tags vX.Y.Z publican además las etiquetas semver de las imágenes.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

# Nunca se cancelan despliegues a medias; se encolan.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    name: Build · ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
      packages: write        # push a GHCR
      id-token: write        # firma keyless con cosign (OIDC → Sigstore)
      security-events: write # subir el informe SARIF de Trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de imagen (GHCR exige minúsculas)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build y push (con SBOM y provenance SLSA)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true

      - name: Trivy · escaneo de la imagen publicada
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir resultados a GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar la imagen por digest (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

  staging:
    name: Deploy · staging
    needs: build
    # Los despliegues se activan con la variable de repositorio DEPLOY_ENABLED=true una vez
    # existan los servidores y los GitHub Environments; hasta entonces el CD solo publica imágenes.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      image_tag: sha-${{ github.sha }}
    secrets: inherit

  production:
    name: Deploy · production
    needs: staging
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image_tag: sha-${{ github.sha }}
    secrets: inherit
