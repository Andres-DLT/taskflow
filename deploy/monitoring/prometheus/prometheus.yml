global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Descubre todas las réplicas del backend vía DNS de Docker (sirve durante el blue/green).
  - job_name: backend
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Sondeo externo (caja negra) de la URL pública: disponibilidad real y caducidad del TLS.
  # deploy.sh genera targets/blackbox.json a partir de DOMAIN.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
