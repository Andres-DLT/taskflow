route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Si hay una alerta crítica, se silencian los warnings que dependen de ella.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [instance]

receivers:
  - name: slack
    slack_configs:
      # Incoming webhook de Slack; el fichero lo crea scripts/init-secrets.sh.
      - api_url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.runbook }} — {{ .Annotations.runbook }}{{ end }}{{ "\n" }}{{ end }}'
